server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the 10 MiB upload limit so multipart overhead fits;
    # the backend enforces the real limit.
    client_max_body_size 11m;
    error_page 413 @upload_too_large;

    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"The uploaded file exceeds the 10 MiB limit."}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
