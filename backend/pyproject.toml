[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-project-backend"
version = "0.1.0"
description = "FastAPI backend for Senior Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.115,<1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    # Capped so rebuilds stay compatible with the pickled artifacts in app/services/models.
    "xgboost>=3.2,<3.3",
    "joblib>=1.6",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
